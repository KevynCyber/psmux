[package]
name = "psmux"
version = "4.0.0"
edition = "2021"
description = "Terminal multiplexer for Windows - tmux alternative for PowerShell and Windows Terminal"
license = "MIT"
repository = "https://github.com/psmux/psmux"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tmux", "windows", "powershell"]
categories = ["command-line-utilities"]

# Forwards to the psmux-tui dependency's own "underline-color" feature so
# src/term/backend.rs can `#[cfg(feature = "underline-color")]` the
# psmux_tui::buffer::Cell::underline_color field -- tests/monitor is a
# separate crate/workspace whose own psmux-tui build omits that feature, and
# this module tree is recompiled once per binary that #[path]-includes it.
[features]
default = ["underline-color"]
underline-color = ["psmux-tui/underline-color"]

[workspace]
members = [".", "crates/vt100-psmux", "crates/psmux-unicode", "crates/psmux-json", "crates/psmux-regex", "crates/psmux-tui"]
exclude = [
    "target/",
    "release/",
    "tests/",
    "tests-rs/",
    "packages/",
    "psmux-windows-x86_64/",
    ".github/",
    "scripts/",
    "scoop/",
    "examples/",
    "*.txt",
]

# Disable auto-discovery of integration tests from tests/ directory
[[test]]
name = "test_vt100_mouse"
path = "tests-rs/test_vt100_mouse.rs"

[[test]]
name = "test_issue155_sgr_attrs"
path = "tests-rs/test_issue155_sgr_attrs.rs"

[[test]]
name = "test_issue155_rendering"
path = "tests-rs/test_issue155_rendering.rs"

[[test]]
name = "test_issue201_rename_dialog"
path = "tests-rs/test_issue201_rename_dialog.rs"

[[test]]
name = "test_issue269_osc94_dropped"
path = "tests-rs/test_issue269_osc94_dropped.rs"

[[test]]
name = "test_h1_osc52_clipboard_capture"
path = "tests-rs/test_h1_osc52_clipboard_capture.rs"

[[test]]
name = "test_h1_osc52_end_to_end"
path = "tests-rs/test_h1_osc52_end_to_end.rs"

[[test]]
name = "test_issue299_osc_command_state"
path = "tests-rs/test_issue299_osc_command_state.rs"

[[test]]
name = "test_issue299_pwsh_snippet_integration"
path = "tests-rs/test_issue299_pwsh_snippet_integration.rs"

[[test]]
name = "test_pr469_osc_command_safety"
path = "tests-rs/test_pr469_osc_command_safety.rs"

[[test]]
name = "test_issue494_copymode_freeze"
path = "tests-rs/test_issue494_copymode_freeze.rs"

[[test]]
name = "test_zero_third_party_deps"
path = "tests-rs/test_zero_third_party_deps.rs"

[[test]]
name = "test_unsafe_inventory"
path = "tests-rs/test_unsafe_inventory.rs"

# Windows only
[target.'cfg(not(windows))'.dependencies]
[target.'cfg(windows)'.dependencies]

[[bin]]
name = "psmux"
path = "src/main.rs"

[[bin]]
name = "pmux"
path = "src/main.rs"

[[bin]]
name = "tmux"
path = "src/main.rs"

[dependencies]
psmux-tui = { path = "crates/psmux-tui", default-features = false }
vt100 = { version = "0.16.10", path = "crates/vt100-psmux", package = "vt100-psmux" }
psmux-unicode = { path = "crates/psmux-unicode" }
psmux-json = { path = "crates/psmux-json" }
psmux-regex = { path = "crates/psmux-regex" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
