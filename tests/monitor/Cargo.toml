[workspace]

[package]
name = "psmux-test-monitor"
version = "0.1.0"
edition = "2021"
description = "Realtime mouse-driven TUI monitor for psmux test runs (tests/run_all_tests.ps1)"
publish = false

[[bin]]
name = "psmux-test-monitor"
path = "src/main.rs"

[dependencies]
psmux-tui = { path = "../../crates/psmux-tui", default-features = false }
psmux-json = { path = "../../crates/psmux-json" }

# Declared (never enabled) so src/term/backend.rs's
# #[cfg(feature = "underline-color")] doesn't trip check-cfg here; this
# crate's own psmux-tui build omits the matching underline-color feature.
[features]
underline-color = []

[profile.release]
opt-level = 2
