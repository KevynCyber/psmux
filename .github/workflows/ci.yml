name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            label: Windows x64
          - target: i686-pc-windows-msvc
            label: Windows x86
          - target: aarch64-pc-windows-msvc
            label: Windows ARM64

    steps:
      - uses: actions/checkout@v7

      # Pinned to match rust-toolchain.toml's channel: with zero third-party
      # dependencies the toolchain is the project's only external
      # supply-chain surface, so the CI install step and rust-toolchain.toml
      # are pinned to the same version deliberately -- leaving this on
      # `@stable` meant CI downloaded a toolchain it then never compiled
      # with, and let `stable` drift silently.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

  test:
    name: Test ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            label: Windows x64
          - target: i686-pc-windows-msvc
            label: Windows x86

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run full Rust unit tests
        run: cargo test --all-targets --locked --target ${{ matrix.target }}

      - name: Run PR smoke tests
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target\${{ matrix.target }}\release\psmux.exe").Path
          $env:PSMUX_EXE = $exe
          .\tests\run_smoke_integration.ps1

      - name: Run raw SSH pipe mouse integration
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target\${{ matrix.target }}\release\psmux.exe").Path
          .\tests\test_windows10_ssh_pipe_mouse.ps1 -Psmux $exe

  test-arm64:
    name: Test Windows ARM64 (informational)
    runs-on: windows-11-arm
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-pc-windows-msvc

      # Informational only until the windows-11-arm runner is confirmed
      # available on this repo's plan (plan Open question 3). continue-on-error
      # keeps a runner-provisioning failure from blocking PRs.
      - name: Run full Rust unit tests
        run: cargo test --all-targets --locked --target aarch64-pc-windows-msvc

  test-monitor:
    name: Build test monitor
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      # tests/monitor is its own workspace and is not covered by the build or
      # test jobs above, so nothing caught it when a dependency bump broke its
      # API. Build it and render one headless frame so a break shows up here
      # instead of the next time someone tries to watch a test run.
      - name: Build monitor
        working-directory: tests/monitor
        run: cargo build --release --locked

      - name: Render one headless frame
        shell: pwsh
        working-directory: tests/monitor
        run: |
          $exe = (Resolve-Path "target\release\psmux-test-monitor.exe").Path
          $out = & $exe --snapshot 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "monitor --snapshot exited $LASTEXITCODE" }
          if ($out -notmatch 'psmux test monitor') {
            Write-Host $out
            throw "snapshot frame did not render the monitor header"
          }
          $lineCount = ($out -split "`r?`n").Count
          Write-Host "monitor rendered $lineCount lines"
          if ($lineCount -lt 20) { throw "frame too short ($lineCount lines), expected a full 40-row render" }

      # The golden fixture is regenerated by re-running the monitor with
      # --snapshot and copying its output over tests-rs/fixtures/monitor_snapshot.txt
      # whenever the monitor UI changes on purpose.
      - name: Diff snapshot against golden
        shell: pwsh
        working-directory: tests/monitor
        run: |
          $exe = (Resolve-Path "target\release\psmux-test-monitor.exe").Path
          $out = & $exe --snapshot 2>&1 | Out-String
          $actualPath = New-TemporaryFile
          Set-Content -Path $actualPath -Value $out -NoNewline

          $goldenPath = Resolve-Path "..\..\tests-rs\fixtures\monitor_snapshot.txt"

          $actual = (Get-Content -Raw -Path $actualPath) -replace "`r`n", "`n"
          $golden = (Get-Content -Raw -Path $goldenPath) -replace "`r`n", "`n"
          $actual = $actual.TrimEnd("`n")
          $golden = $golden.TrimEnd("`n")

          if ($actual -ne $golden) {
            $diff = Compare-Object -ReferenceObject ($golden -split "`n") -DifferenceObject ($actual -split "`n")
            Write-Host ($diff | Format-Table -AutoSize | Out-String)
            throw "monitor snapshot does not match tests-rs/fixtures/monitor_snapshot.txt"
          }

  zero-deps:
    name: Zero third-party dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      # The supply-chain gate used to be "audit the third-party crates"
      # (cargo-audit against RUSTSEC advisories). With zero registry
      # dependencies there is nothing left for cargo-audit to check -- every
      # manifest dependency is a `path = ...` workspace crate -- so the gate
      # moved to "prove there are no third-party crates" instead. The one
      # remaining external supply-chain surface is the Rust toolchain itself,
      # pinned in rust-toolchain.toml.
      - name: Run zero-dependency gate test
        run: cargo test --test test_zero_third_party_deps --locked

  posix-helper-tests:
    name: POSIX helper tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Test SSH wrapper cleanup
        run: sh tests/test_psmux_ssh_wrapper.sh

      - name: Test helper installation
        run: sh tests/test_install_psmux_win.sh
